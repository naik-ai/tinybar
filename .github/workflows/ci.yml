name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # A retry may be because GitHub had no arm64 runner, so it asks another pool with the same Xcode.
    runs-on: ${{ github.run_attempt > 1 && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: ./Scripts/build-app.sh

  backend:
    # The local model backend (backend/): its pytest suite in the locked dev environment. No model, MLX
    # computation or network is used by the tests (tests/conftest.py refuses any non-loopback connection);
    # the network is only needed to install the locked packages. MLX's wheels are Apple-silicon only.
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Runner network settings (for diagnosis)
        run: |
          env | grep -i proxy || echo "no proxy variables"
          scutil --proxy | head -20
          python3 -c "import urllib.request; print('urllib proxies:', urllib.request.getproxies())"
      - name: Test
        run: uv run --locked --offline pytest -q -rf --maxfail=5
